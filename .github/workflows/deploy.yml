name: Deploy to Linux Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            DEPLOY_PATH="/home/www/AITestHub"

            echo "========================================"
            echo "开始部署 AITestHub"
            echo "========================================"

            cd "${DEPLOY_PATH}"

            # ==================================================
            # 1. 拉取最新代码
            # ==================================================

            echo "开始同步最新代码..."

            # 获取远程 master 最新代码
            git fetch origin master

            # 服务器代码完全跟随 GitHub master
            # 注意：会丢弃服务器 Git 管理范围内的本地修改
            git reset --hard origin/master

            echo "代码同步完成"

            # ==================================================
            # 2. 更新后端 Python 依赖
            # ==================================================

            echo "开始检查后端 Python 依赖..."

            "${DEPLOY_PATH}/venv/bin/python" -m pip install -r requirements.txt

            # 检查 Python 依赖是否存在冲突
            "${DEPLOY_PATH}/venv/bin/python" -m pip check

            echo "后端依赖检查完成"

            # ==================================================
            # 3. 配置 Node.js 环境
            # ==================================================

            # 服务器 Node.js 通过 nvm 安装
            # GitHub Actions 通过 SSH 执行时不一定会自动加载 nvm，
            # 所以这里直接把 Node 20.20.2 的 bin 目录加入 PATH。
            export PATH="/home/ubuntu/.nvm/versions/node/v20.20.2/bin:$PATH"

            # 输出 Node 和 npm 版本，方便确认部署环境
            echo "Node 版本：$(node -v)"
            echo "npm 版本：$(npm -v)"

            # ==================================================
            # 4. 更新前端依赖并构建
            # ==================================================

            cd "${DEPLOY_PATH}/frontend"

            echo "开始安装前端依赖..."

            npm install

            echo "开始构建前端..."

            npm run build

            echo "前端构建完成"

            # ==================================================
            # 5. 重启 FastAPI 后端
            # ==================================================

            cd "${DEPLOY_PATH}"

            echo "开始重启 AITestHub 后端..."

            sudo systemctl restart aitesthub

            # ==================================================
            # 6. 检查后端服务状态
            # ==================================================

            echo "检查 AITestHub 服务状态..."

            sudo systemctl is-active --quiet aitesthub

            echo "后端服务运行正常"

            # ==================================================
            # 7. 部署完成
            # ==================================================

            echo "========================================"
            echo "AITestHub 部署成功"
            echo "Node：$(node -v)"
            echo "npm：$(npm -v)"
            echo "时间：$(date)"
            echo "========================================"