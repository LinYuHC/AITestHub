name: Deploy to Linux Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            DEPLOY_PATH="/home/www/AITestHub"
            
            echo "========================================"
            echo "开始部署 AITestHub"
            echo "========================================"
            
            cd "${DEPLOY_PATH}"
            
            # ==================================================
            # 1. 拉取最新代码
            # ==================================================
            
            git fetch origin master
            
            # 部署服务器完全跟随远程 master
            git reset --hard origin/master
            
            # ==================================================
            # 2. 更新后端依赖
            # ==================================================
            
            "${DEPLOY_PATH}/venv/bin/python" -m pip install -r requirements.txt
            "${DEPLOY_PATH}/venv/bin/python" -m pip check
            
            # ==================================================
            # 3. 更新前端依赖并构建
            # ==================================================
            
            cd "${DEPLOY_PATH}/frontend"
            
            npm install
            npm run build
            
            # ==================================================
            # 4. 重启 FastAPI
            # ==================================================
            
            cd "${DEPLOY_PATH}"
            
            echo "开始重启 AITestHub"
            
            sudo systemctl restart aitesthub
            
            # ==================================================
            # 5. 检查服务
            # ==================================================
            
            sudo systemctl is-active --quiet aitesthub
            
            echo "========================================"
            echo "AITestHub 部署成功"
            echo "时间：$(date)"
            echo "========================================"