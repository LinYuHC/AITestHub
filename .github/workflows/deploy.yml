name: Deploy to Linux Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
          
            DEPLOY_PATH="/home/www/AITestHub"
          
            echo "========================================"
            echo "开始部署 AITestHub"
            echo "========================================"
          
            cd "${DEPLOY_PATH}"
          
            # ==================================================
            # 0. 丢弃本地对 package-lock.json 的修改（解决合并冲突）
            # ==================================================
            git restore frontend/package-lock.json 2>/dev/null || true
          
            # ==================================================
            # 1. 拉取最新代码
            # ==================================================
            git pull origin master

            # ==================================================
            # 2. 更新 后端 Python 依赖
            # ==================================================
            "${DEPLOY_PATH}/venv/bin/python" -m pip install -r requirements.txt
            "${DEPLOY_PATH}/venv/bin/python" -m pip check

            # ==================================================
            # 3. 更新 前端 Node 依赖 + 构建（新增！）
            # ==================================================
            cd "${DEPLOY_PATH}/frontend"

            # 安装前端依赖（包括 pinia 和 md-editor-v3）
            npm install

            # 构建生产环境静态文件（生成 dist 目录）
            npm run build

            # 回到项目根目录
            cd "${DEPLOY_PATH}"

            # ==================================================
            # 4. 重启 FastAPI 后端
            # ==================================================
            echo "开始重启 AITestHub"
            sudo systemctl restart aitesthub

            # ==================================================
            # 5. 检查服务状态
            # ==================================================
            sudo systemctl is-active --quiet aitesthub

            echo "========================================"
            echo "AITestHub 部署成功"
            echo "时间：$(date)"
            echo "========================================"